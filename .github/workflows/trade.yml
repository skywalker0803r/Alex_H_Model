name: Gate.io H-Model Automated Trading Workflow

on:
  schedule:
    # Run every hour at the top of the hour
    - cron: '0 * * * *'
  # Allow manual trigger via GitHub Actions UI
  workflow_dispatch:

jobs:
  execute-strategy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Trading Strategy Script
        env:
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_SYMBOL: ${{ secrets.TRADING_SYMBOL || 'BTC/USDT' }}
          LEVERAGE: ${{ secrets.LEVERAGE || '1' }}
          CONTRACT_SIZE: ${{ secrets.CONTRACT_SIZE || '1' }}
          BIAS_THRESHOLD: ${{ secrets.BIAS_THRESHOLD || '0' }}
          SPREAD_THRESHOLD: ${{ secrets.SPREAD_THRESHOLD || '0' }}
          DEBUG_MODE: ${{ secrets.DEBUG_MODE || 'false' }}
        run: python strategy.py
      
      - name: Upload Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trading-logs
          path: trading_log.txt
          retention-days: 7
